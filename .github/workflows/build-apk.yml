name: Build Native APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 16.0
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: true
          packages: platforms;android-34 build-tools;34.0.0 ndk;26.1.10909125

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: olivia-native-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: native-apk-v${{ github.run_number }}
          name: Olivia Native APK (build ${{ github.run_number }})
          files: app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-desktop:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build desktop DMG
        run: ./gradlew :desktop:packageDmg --no-daemon

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: olivia-native-dmg
          path: desktop/build/compose/binaries/main/dmg/*.dmg

      - name: Publish DMG to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: native-dmg-v${{ github.run_number }}
          name: Olivia Native DMG (build ${{ github.run_number }})
          files: desktop/build/compose/binaries/main/dmg/*.dmg
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}